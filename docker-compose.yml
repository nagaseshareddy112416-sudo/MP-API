version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gfc-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"YourStrong@Passw0rd\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./MP-API
      dockerfile: Dockerfile
    container_name: gfc-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=GfcEngineDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=True;
      - Jwt__Key=SuperSecretKeyForDevelopmentAndTestingPurposesOnly12345!
      - Jwt__Issuer=GfcEngine
      - Jwt__Audience=GfcEngineUsers
      - Jwt__ExpiryHours=720
    ports:
      - "5000:8080"

  web:
    build:
      context: ./MP-Web
      dockerfile: Dockerfile
    container_name: gfc-web
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  mssql_data:
